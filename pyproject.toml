[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-dependency-license-sentinel"
version = "0.1.0"
description = "Source import scanner and package manifest inspector auditing libraries for copyleft taint"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
agent-dependency-license-sentinel = "agent_dependency_license_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_dependency_license_sentinel*"]
